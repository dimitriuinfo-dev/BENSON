apply plugin: 'com.android.library'

group = 'expo.modules.foregroundservice'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 35)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 35)
    }
  }
}

android {
  namespace "expo.modules.foregroundservice"
  buildFeatures { buildConfig true }
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    buildConfigField "String", "WAKE_MODEL_PROFILE", "\"${project.findProperty('wakeWordProfile') ?: 'benson'}\""
    externalNativeBuild {
      cmake { cppFlags "-std=c++17" }
    }
  }
  externalNativeBuild {
    cmake {
      path file("src/main/cpp/CMakeLists.txt")
      version "3.22.1"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NATIVE_CMD_1 (2026-10-02) — BensonForegroundService.kt calls CaptureEngine directly (reuse,
  // not reimplementation, of the already-proven VAD/pre-roll/WAV capture in that module). This is
  // the one mechanical Gradle wire-up a cross-module Kotlin call requires; not itself a code
  // change to either module's logic. Revert: remove this line (and the CaptureEngine call sites).
  implementation project(":benson-audio-capture")

  // RUNDA_N3 (2026-10-02) — same mechanical cross-module wire-up as benson-audio-capture above.
  // benson-accessibility: reads BensonAccessibilityService.lastForegroundPackage/instance (Task A).
  // benson-notification-listener: calls MediaTransport.control, extracted from that module's own
  // Expo Function (Task C). Revert: remove these two lines and their call sites.
  implementation project(":benson-accessibility")
  implementation project(":benson-notification-listener")

  // RUNDA CAR-3a (2026-10-04) — pushes state/dialog updates to BensonCarScreen.instance when
  // Android Auto is showing Benson's own screen. Revert: remove this line and the push call sites
  // in updateBubbleNative/closeSession.
  implementation project(":benson-car")

  // NATIVE_JS_RELIABLE_HANDOFF_FIX_1 (2026-09-19) — BensonWakeHeadlessTaskService extends RN's
  // own com.facebook.react.HeadlessJsTaskService; useCoreDependencies() above only brings in
  // expo-modules-core's own Promise/Function abstractions, not the raw RN bridge classes. Same
  // unversioned coordinate android/app/build.gradle already uses — resolved by the React Native
  // Gradle plugin's own version management, so no separate pin needed (or risked going stale).
  implementation "com.facebook.react:react-android"

  // Guardian secondary revival layer (BensonHealthWorker) — periodic health check independent
  // of the AlarmManager watchdog and the AccessibilityService resurrection anchor.
  implementation "androidx.work:work-runtime-ktx:2.9.1"

  // Wake-word engine (product-owner-directed 2026-08-01) — plain Android AAR, confirmed via
  // GitHub source (PorcupineManager.Builder.build(Context, PorcupineManagerCallback)) to take a
  // plain android.content.Context, NOT a React Native ReactApplicationContext. A Service already
  // IS a Context, so this needs no RN bridge at all — unlike whisper.rn, which is why that path
  // was blocked. See WAKE_ENGINE in BensonForegroundService.kt for the runtime fallback.
  implementation "ai.picovoice:porcupine-android:3.0.1"

  // ROUND_NATIVE_WAKE_MICROWAKEWORD_1 — on-device wake-word inference. LiteRT (TensorFlow Lite)
  // core runtime only, no select-TF-ops. Apache-2.0. Runs on a plain Context inside the
  // foreground service (no RN bridge) — the whole point: wake detection survives JS suspension.
  implementation "org.tensorflow:tensorflow-lite:2.16.1"

  // Heed local custom-word detector. CPU inference in the foreground service; no JS-bridge mic
  // loop. Keep in sync with the pinned ONNX Runtime Java API and app R8 keep rule.
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.24.3@aar"

  // ROUND_WAKE_NATIVE_GENERIC_1 — NOT a new library: OkHttp 4.9.2 is already resolved on this
  // module's own release dependency graph transitively via React Native's networking stack
  // (confirmed via the resolved lint dependency report before this round). This line only makes
  // `okhttp3.*` resolvable at COMPILE time for NativeCloudWake.kt's direct import — pinned to the
  // exact version already present everywhere else in the app to avoid duplicate-class/version
  // skew. Used for the native cloud wake loop's STT request (Groq's OpenAI-compatible endpoint).
  implementation "com.squareup.okhttp3:okhttp:4.9.2"

  // RUNDA TEST-1 (2026-10-03) — WakeVerifyMatcherTest, plain JVM unit test, no device/instrumentation.
  testImplementation "junit:junit:4.13.2"
}
